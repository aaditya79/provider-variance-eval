[project]
name = "provider-variance"
version = "0.1.0"
description = "Harness for measuring provider-induced variance in API-based LLM evaluation (OpenRouter)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "datasets>=2.18",        # GSM8K / MMLU / HumanEval loaders
    "human-eval>=1.0; python_version < '3.13'",  # optional; we vendor the check logic regardless
    "numpy>=1.26",
    "scipy>=1.11",           # Wilson CIs, McNemar
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.1",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv"]

[tool.ruff]
line-length = 100
target-version = "py311"
